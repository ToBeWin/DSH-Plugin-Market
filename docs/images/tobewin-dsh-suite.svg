<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ToBeWin DeepSeek Harness plugin suite</title>
  <desc id="desc">Five independent community plugins and a desktop host for DeepSeek Harness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#101c36"/>
      <stop offset="1" stop-color="#162b46"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#58b8ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#58b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#73c7ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020817" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="40" fill="url(#glow)"/>
  <circle cx="1418" cy="144" r="184" fill="none" stroke="#8dcfff" stroke-opacity="0.16" stroke-width="42"/>
  <circle cx="1418" cy="144" r="98" fill="none" stroke="#a79aff" stroke-opacity="0.2" stroke-width="28"/>
  <g transform="translate(110 92)">
    <rect width="178" height="54" rx="27" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="89" y="36" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700" fill="#f4f8ff">ToBeWin</text>
  </g>
  <text x="110" y="252" font-family="Inter, ui-sans-serif, system-ui" font-size="76" font-weight="760" fill="#f6f9ff">DeepSeek Harness,</text>
  <text x="110" y="338" font-family="Inter, ui-sans-serif, system-ui" font-size="76" font-weight="760" fill="url(#accent)">upgraded.</text>
  <text x="114" y="408" font-family="Inter, ui-sans-serif, system-ui" font-size="29" fill="#b9c7da">Independent plugins. Local-first. No Harness fork.</text>
  <text x="114" y="451" font-family="PingFang SC, Microsoft YaHei, Inter, sans-serif" font-size="27" fill="#8799b3">独立插件 · 本地优先 · 不修改官方源码</text>
  <g transform="translate(110 526)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui">
    <g>
      <rect width="250" height="110" rx="24" fill="#152641" stroke="#5d769a" stroke-opacity="0.48"/>
      <circle cx="45" cy="43" r="20" fill="#66c2ff" fill-opacity="0.18"/>
      <path d="M35 43h20M45 33v20" stroke="#82d0ff" stroke-width="4" stroke-linecap="round"/>
      <text x="78" y="48" font-size="22" font-weight="700" fill="#f5f8ff">Plugin Market</text>
      <text x="26" y="83" font-size="17" fill="#9fb0c7">Install and manage</text>
    </g>
    <g transform="translate(270)">
      <rect width="250" height="110" rx="24" fill="#152641" stroke="#5d769a" stroke-opacity="0.48"/>
      <circle cx="45" cy="43" r="20" fill="#8b7cff" fill-opacity="0.2"/>
      <path d="M36 43h18M39 37l-5 6 5 6" fill="none" stroke="#aa9fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="48" font-size="22" font-weight="700" fill="#f5f8ff">Temporary Chat</text>
      <text x="26" y="83" font-size="17" fill="#9fb0c7">Chat without a project</text>
    </g>
    <g transform="translate(540)">
      <rect width="250" height="110" rx="24" fill="#152641" stroke="#5d769a" stroke-opacity="0.48"/>
      <circle cx="45" cy="43" r="20" fill="#ee7cbd" fill-opacity="0.2"/>
      <path d="M35 49c8-22 18-22 21 0M37 39h17" fill="none" stroke="#ff9bd3" stroke-width="3.5" stroke-linecap="round"/>
      <text x="78" y="48" font-size="22" font-weight="700" fill="#f5f8ff">Skin Studio</text>
      <text x="26" y="83" font-size="17" fill="#9fb0c7">Themes and wallpapers</text>
    </g>
    <g transform="translate(810)">
      <rect width="250" height="110" rx="24" fill="#152641" stroke="#5d769a" stroke-opacity="0.48"/>
      <circle cx="45" cy="43" r="20" fill="#ffb866" fill-opacity="0.2"/>
      <circle cx="39" cy="41" r="4" fill="#ffd090"/><circle cx="51" cy="41" r="4" fill="#ffd090"/>
      <path d="M40 50q5 5 10 0" fill="none" stroke="#ffd090" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="48" font-size="22" font-weight="700" fill="#f5f8ff">Pet Companion</text>
      <text x="26" y="83" font-size="17" fill="#9fb0c7">16 animated friends</text>
    </g>
    <g transform="translate(1080)">
      <rect width="300" height="110" rx="24" fill="#152641" stroke="#5d769a" stroke-opacity="0.48"/>
      <circle cx="45" cy="43" r="20" fill="#55d7bb" fill-opacity="0.19"/>
      <path d="M35 36h20v15H35zM39 55h12" fill="none" stroke="#75ead1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="48" font-size="21" font-weight="700" fill="#f5f8ff">Developer Workbench</text>
      <text x="26" y="83" font-size="17" fill="#9fb0c7">Files · Preview · Terminal</text>
    </g>
