  <g transform="translate(110 704)">
    <rect width="1380" height="92" rx="28" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="42" y="57" font-family="Inter, ui-sans-serif, system-ui" font-size="25" fill="#d7e2f0">Plus DSH Desktop for macOS and Windows</text>
    <text x="1338" y="57" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#78c9ff">github.com/ToBeWin</text>
